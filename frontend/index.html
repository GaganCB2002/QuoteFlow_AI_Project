<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO Meta Tags -->
    <title>QuoteFlow AI — India's #1 AI Quotation, Billing, CRM & Marketing Platform</title>
    <meta name="description" content="QuoteFlow AI is India's leading all-in-one business platform. Create AI-powered quotations in 30 seconds, send GST invoices, manage CRM leads, run WhatsApp campaigns, and track finance — all from one dashboard. Trusted by 12,000+ businesses." />
    <meta name="keywords" content="AI quotation software, GST billing software India, CRM software, WhatsApp marketing, invoice generator, business management platform, quotation maker, GST invoice, project estimation tool, QuoteFlow AI" />
    <meta name="author" content="QuoteFlow AI" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="canonical" href="https://quoteflow.ai/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://quoteflow.ai/" />
    <meta property="og:title" content="QuoteFlow AI — Replace 5 Tools With One AI Platform" />
    <meta property="og:description" content="AI-powered quotations, GST billing, CRM, WhatsApp marketing & finance analytics — all in one dashboard. Start free, no credit card needed." />
    <meta property="og:image" content="https://quoteflow.ai/og-image.png" />
    <meta property="og:site_name" content="QuoteFlow AI" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://quoteflow.ai/" />
    <meta name="twitter:title" content="QuoteFlow AI — India's #1 AI Business Platform" />
    <meta name="twitter:description" content="Create AI quotations in 30s, send GST invoices, manage CRM, run WhatsApp campaigns. Trusted by 12,000+ Indian businesses." />
    <meta name="twitter:image" content="https://quoteflow.ai/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />

    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- JSON-LD Structured Data: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "QuoteFlow AI",
      "description": "India's #1 AI-powered quotation, GST billing, CRM, and marketing platform for small and medium businesses.",
      "url": "https://quoteflow.ai",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web, Android, iOS",
      "offers": [
        {
          "@type": "Offer",
          "name": "Starter",
          "price": "0",
          "priceCurrency": "INR",
          "description": "Free plan with 100 quotations/month"
        },
        {
          "@type": "Offer",
          "name": "Professional",
          "price": "499",
          "priceCurrency": "INR",
          "billingIncrement": "1",
          "unitCode": "MON",
          "description": "Unlimited quotations, AI generator, CRM & follow-ups"
        },
        {
          "@type": "Offer",
          "name": "Business",
          "price": "999",
          "priceCurrency": "INR",
          "billingIncrement": "1",
          "unitCode": "MON",
          "description": "Everything in Professional plus marketing campaigns & API access"
        }
      ],
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "ratingCount": "12000",
        "bestRating": "5"
      },
      "author": {
        "@type": "Organization",
        "name": "QuoteFlow AI",
        "url": "https://quoteflow.ai"
      }
    }
    </script>

    <!-- JSON-LD Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "QuoteFlow AI",
      "url": "https://quoteflow.ai",
      "logo": "https://quoteflow.ai/logo.svg",
      "description": "AI-powered business management platform for Indian SMBs",
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "support@quoteflow.ai",
        "contactType": "customer support"
      },
      "sameAs": []
    }
    </script>
  </head>
  <body class="bg-gray-50 text-gray-900 font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
