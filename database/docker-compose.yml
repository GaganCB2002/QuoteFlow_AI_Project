name: QuoteFlow AI
description: Smart Quotation, Billing, CRM & Marketing Platform
version: 1.0.0

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: quoteflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
