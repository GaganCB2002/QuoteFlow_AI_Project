spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/quoteflow}
    driverClassName: ${DB_DRIVER:org.postgresql.Driver}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID:placeholder-client-id}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:placeholder-client-secret}
            scope:
              - email
              - profile

server:
  port: ${SERVER_PORT:8081}
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: ${SSL_KEYSTORE:}
    key-store-password: ${SSL_KEYSTORE_PASSWORD:}
    key-store-type: PKCS12
    key-alias: quoteflow

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:86400000}

encryption:
  secret:
    key: ${ENCRYPTION_SECRET_KEY:8f47e3a2b1c5d6e7f809a1b2c3d4e5f6}
